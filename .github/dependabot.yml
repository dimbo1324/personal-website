version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "prettier-plugin-tailwindcss"]
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "globals"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
