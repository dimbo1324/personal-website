packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency lifecycle scripts by default. Only packages that
# genuinely need to compile or download a native binary are allowed through.
# Anything not listed here stays blocked; review before adding.
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Only a polyfill shim; its postinstall just prints a funding banner.
  core-js-pure: false

# ---------------------------------------------------------------------------
# Single source of truth for dependency versions across the whole workspace.
# Reference them from any package.json as `"react": "catalog:"`.
# Bump a version here once -> every app/package moves together.
# ---------------------------------------------------------------------------
catalog:
  # --- runtime: react -------------------------------------------------------
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # --- framework ------------------------------------------------------------
  next: ^16.2.12

  # --- language -------------------------------------------------------------
  typescript: ~5.9.3
  # Matches the Node 22 LTS runtime pinned in .nvmrc.
  "@types/node": ^22.20.1

  # --- styling / ui ---------------------------------------------------------
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  tw-animate-css: ^1.4.0
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  lucide-react: ^1.27.0
  framer-motion: ^12.43.0
  "@radix-ui/react-slot": ^1.2.4
  "@radix-ui/react-label": ^2.1.8
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-accordion": ^1.2.20

  # --- data / state / validation -------------------------------------------
  zod: ^4.4.3
  react-hook-form: ^7.83.0
  "@hookform/resolvers": ^5.5.7

  # --- testing --------------------------------------------------------------
  # Jest + SWC: no Vite anywhere in the toolchain.
  jest: ^30.4.2
  jest-environment-jsdom: ^30.4.1
  "@types/jest": ^30.0.0
  "@swc/jest": ^0.2.39
  "@swc/core": ^1.15.47
  "@testing-library/react": ^16.3.2
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/user-event": ^14.6.1

  # --- linting / formatting -------------------------------------------------
  eslint: ^10.8.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.65.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-perfectionist: ^5.10.0
  "@next/eslint-plugin-next": ^16.2.12
  globals: ^17.8.0
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1

  # Used by Next for production image optimisation.
  sharp: ^0.34.5

  # --- tooling --------------------------------------------------------------
  turbo: ^2.10.7
  husky: ^9.1.7
  lint-staged: ^17.2.0
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
